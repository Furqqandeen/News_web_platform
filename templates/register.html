{% extends "home.html" %}


{% block content %}

{% load crispy_forms_tags %}

<h1 style='text-align:center;'>Registeration Page</h1>
<form action="{% url "register" %}" method='POST' style='width:50%; margin:auto;'>
    {% csrf_token %}
    {{ form | crispy }}
    <button type="submit" class='btn btn-primary'>Submit</button>

</form>

{% endblock content %}
